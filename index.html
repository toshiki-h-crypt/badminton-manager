<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>ダブルス対戦管理</title>

<meta
    name="theme-color"
    content="#2e7d32">

<link
    rel="manifest"
    href="manifest.json">

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<header class="app-header">

    <h1>
        🎾 ダブルス対戦管理
    </h1>

</header>

<nav class="tabs">

    <button
        class="tab-button active"
        data-tab="settingTab">

        設定

    </button>

    <button
        class="tab-button"
        data-tab="matchTab">

        試合

    </button>

    <button
        class="tab-button"
        data-tab="adminTab">

        管理

    </button>

</nav>

<main>

    <!-- ========================= -->
    <!-- 設定 -->
    <!-- ========================= -->

    <section
        id="settingTab"
        class="tab-content active">

        <div class="card">

            <h2>参加者登録</h2>

            <label>
                人数登録
            </label>

            <div class="row">

                <input
                    id="numberInput"
                    type="number"
                    min="1"
                    placeholder="人数">

                <button
                    id="addNumberBtn">

                    人数登録

                </button>

            </div>

            <label>
                名前登録
            </label>

            <textarea
                id="nameInput"
                rows="4"
                placeholder="改行・スペース・カンマ区切りで複数登録可能"></textarea>

            <button
                id="addNameBtn">

                参加者追加

            </button>

            <div id="participantSummary">

                参加人数：
                <span id="totalCount">
                    0
                </span>
                人

                （男：
                <span id="maleCount">
                    0
                </span>

                女：
                <span id="femaleCount">
                    0
                </span>

                未：
                <span id="unknownCount">
                    0
                </span>
                ）

            </div>

            <button id="toggleParticipantBtn">
                ▼参加者表示
            </button>

            <div id="participantListContainer">

                <table>

                    <thead>

                    <tr>
                        <th>No</th>
                        <th>名前</th>
                        <th>レベル</th>
                        <th>性別</th>
                        <th>削除</th>
                    </tr>

                    </thead>

                    <tbody id="participantTableBody">
                    </tbody>

                </table>

            </div>

            <button
                id="deleteAllBtn"
                class="danger">

                参加者一括削除

            </button>

        </div>

        <div class="card">

            <h2>試合設定</h2>

            <label>
                使用コート数
            </label>

            <select id="courtCount">
            </select>

            <label>
                全コート合計試合数（継続確認まで）
            </label>

            <input
                id="totalMatches"
                type="number"
                value="30"
                min="1">

            <label>
                試合進行方式
            </label>

            <select id="playMode">

                <option value="batch">
                    一括進行
                </option>

                <option value="individual">
                    個別進行
                </option>

            </select>

            <label>
                オプション設定
            </label>

            <select id="optionMode">

                <option value="-">
                    －
                </option>

                <option value="levelBalance">
                    レベル均等
                </option>

                <option value="levelUnified">
                    レベル統一
                </option>

                <option value="mix">
                    ミックス優先
                </option>

            </select>

            <button
                id="startMatchBtn"
                class="success">

                試合開始

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- 試合 -->
    <!-- ========================= -->

    <section
        id="matchTab"
        class="tab-content">

        <div class="card">

            <label>
                試合進行方式
            </label>

            <select id="matchPlayMode">

                <option value="batch">
                    一括進行
                </option>

                <option value="individual">
                    個別進行
                </option>

            </select>

            <div id="batchControls">

                <button
                    id="finishAllBtn"
                    class="info">

                    試合終了

                </button>

                <button
                    id="nextAllBtn"
                    class="warning">

                    次試合開始

                </button>

            </div>

            <div id="matchInfo">

                第1試合

            </div>

        </div>

        <div id="courtContainer">
        </div>

        <button id="toggleBenchBtn">

            ▼待機選手表示

        </button>

        <div id="benchContainer">

            <table>

                <thead>

                <tr>
                    <th>No</th>
                    <th>名前</th>
                    <th>レベル</th>
                    <th>休憩</th>
                </tr>

                </thead>

                <tbody id="benchTableBody">
                </tbody>

            </table>

        </div>

    </section>

    <!-- ========================= -->
    <!-- 管理 -->
    <!-- ========================= -->

    <section
        id="adminTab"
        class="tab-content">

        <div class="card">

            <h2>データ管理</h2>

            <label>
                自動保存
            </label>

            <select id="autoSave">

                <option value="on">
                    ON
                </option>

                <option value="off">
                    OFF
                </option>

            </select>

        </div>

        <div class="card">

            <h2>組み合わせスコア設定</h2>

            <button
                id="toggleScoreSettingsBtn"
                type="button"
                aria-expanded="false"
                aria-controls="scoreSettingsContent">

                設定を表示

            </button>

            <div
                id="scoreSettingsContent"
                class="hidden">

                <label>同一ペア減点</label>
                <input id="pairPenalty" type="number">

                <label>同一対戦減点</label>
                <input id="opponentPenalty" type="number">

                <label>出場均等加点</label>
                <input id="playBalanceBonus" type="number">

                <label>連続出場減点</label>
                <input id="consecutivePlayPenalty" type="number">

                <label>レベル一致加点</label>
                <input id="levelBonus" type="number">

                <label>ミックス加点</label>
                <input id="mixBonus" type="number">

                <label>コート変更加点</label>
                <input id="courtChangeBonus" type="number">

                <label>出場回数差分の優先基準</label>
                <input id="playCountGapThreshold" type="number" min="1" step="1">

                <label>候補探索回数</label>
                <input id="searchCount" type="number">

                <button
                    id="resetScoreSettingBtn">

                    デフォルトに戻す

                </button>

            </div>

        </div>

        <div class="card">

            <h2>拡張機能</h2>

            <select id="featureMode">

                <option value="-">
                    －
                </option>

            </select>

        </div>

        <button
            id="darkModeBtn"
            class="dark">

            ダークモード切替

        </button>

        <button
            id="resetAppBtn"
            class="danger">

            データ初期化

        </button>

        <button
            id="clearAppCacheBtn"
            type="button">

            キャッシュを削除

        </button>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
