<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ダブルス対戦管理</title>

    <meta name="theme-color" content="#2e7d32">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏸 ダブルス対戦管理</h1>
</header>

<nav class="tabs">

    <button class="tab active" data-tab="settings">
        設定
    </button>

    <button class="tab" data-tab="matches">
        試合
    </button>

    <button class="tab" data-tab="admin">
        管理
    </button>

</nav>

<main>

<!-- 設定 -->

<section id="settings" class="tab-content active">

    <div class="card">

        <h2>参加者登録</h2>

        <label>
            人数登録
        </label>

        <div class="inline-group">

            <input
                type="number"
                id="numberPlayerCount"
                min="1"
                placeholder="人数">

            <button id="addNumberPlayersBtn">
                番号登録
            </button>

        </div>

        <label>
            名前登録
        </label>

        <textarea
            id="playerNames"
            rows="5"
            placeholder="改行・スペース・カンマで複数登録可"></textarea>

        <button id="addNamePlayersBtn">
            参加者追加
        </button>

        <div class="summary">

            参加人数：
            <span id="playerCount">0</span>
            人

        </div>

        <button id="togglePlayerListBtn">
            ▼参加者表示
        </button>

        <div id="playerArea" class="hidden">

            <div id="playerList"></div>

        </div>

        <button class="danger" id="deleteAllPlayersBtn">
            参加者一括削除
        </button>

    </div>

    <div class="card">

        <h2>試合設定</h2>

        <label>
            使用コート数
        </label>

        <select id="courtCount"></select>

        <div id="courtInfo" class="infoArea"></div>

        <label>
            作成試合数
        </label>

        <input
            type="number"
            id="matchLimit"
            value="30"
            placeholder="-">

        <label>
            試合進行方式
        </label>

        <select id="matchMode">

            <option value="bulk">
                一括進行
            </option>

            <option value="individual">
                個別進行
            </option>

        </select>

        <div id="matchModeInfo" class="infoArea"></div>

    </div>

    <div class="card">

        <button class="success" id="generateFixtureBtn">
            対戦表生成
        </button>

        <button class="danger" id="resetFixtureBtn">
            対戦表リセット
        </button>

    </div>

</section>

<!-- 試合 -->

<section id="matches" class="tab-content">

    <div class="card sticky-card">

        <div class="top-line">

            <h2>現在進行中</h2>

            <span>
                生成済み：
                <span id="generatedMatchCount">0</span>
            </span>

        </div>

        <button
            id="finishAllBtn"
            class="primary">

            全試合終了

        </button>

        <div id="activeCourtArea"></div>

    </div>

    <div class="card" id="waitingArea">

        <h2>待機試合</h2>

        <div id="waitingMatchList"></div>

    </div>

    <div class="card">

        <div class="top-line">

            <h2>
                終了試合
            </h2>

            <button
                id="toggleFinishedBtn">

                ▼展開

            </button>

        </div>

        <div
            id="finishedMatchList"
            class="hidden"></div>

        <button
            id="clearFinishedBtn"
            class="danger">

            履歴クリア

        </button>

    </div>

    <div class="card">

        <button
            id="reGenerateBtn"
            class="warning">

            対戦表を再設定

        </button>

    </div>

</section>

<!-- 管理 -->

<section id="admin" class="tab-content">

    <div class="card">

        <button
            id="installBtn"
            class="primary">

            アプリをインストール

        </button>

    </div>

    <div class="card">

        <h2>データ管理</h2>

        <label>
            自動保存
        </label>

        <select id="autoSave">

            <option value="on">
                ON
            </option>

            <option value="off">
                OFF
            </option>

        </select>

    </div>

    <div class="card">

        <h2>拡張機能</h2>

        <label>
            拡張機能設定
        </label>

        <select id="extensionMode">

            <option value="none">
                -
            </option>

            <option value="level-balance">
                レベル均等
            </option>

            <option value="level-unify">
                レベル統一
            </option>

            <option value="mix">
                ミックス優先
            </option>

        </select>

        <div
            id="extensionInfo"
            class="infoArea"></div>

    </div>

    <div class="card">

        <button
            id="darkModeBtn"
            class="secondary">

            ダークモード切替

        </button>

    </div>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
